name: feature
description: A feature, built with its tests, documented, reviewed (and audited, labelled security), merged.
for: [feature, task]
concurrency: 3

jobs:
  build:
    agent: build
    prompt: |
      Build {issue}: {issue.title}.

      {issue.description}

      Acceptance criteria:
      {issue.acceptance}

  security:
    needs: build
    if: (member "security" (issue-labels))
    agent: security

  docs:
    needs: build
    agent: docs

  review:
    needs: [build, docs]
    agent: review
    prompt: |
      Review {branch}, for {issue}: {issue.title}.

      Acceptance criteria:
      {issue.acceptance}

      The builder said: {jobs.build.notes}
    outcomes:
      approved: continue
      changes: rerun build

  merge:
    needs: [review, security]
    concurrency: 1
    uses: merge
    on-fail: build
