# A workflow of this config's own: your main pushed to GitHub and its Actions
# watched until they pass. No gh (or not logged in), not on main: the run
# fails at once (check). Nothing to push: on to the watching (push);
# finished already, their verdict at once (watch). A failure: its jobs' logs
# to an agent with the ci profile, which finds why, fixes the code or its
# test and commits on your main; the job runs again from its push
# (retry-from): your main pushed again (the fix, and anything you committed
# meanwhile), watched again, 5 times at most (then the run asks you). It
# works in your checkout (runs-in: checkout): no branch of its own, nothing
# to merge. No ticket: M-x agent-workflow-run, or agent-workflow run
# --workflow github.

# The workflow's name: its file's (github.yml), said again.
name: github

# What it's for, in a line: shown where you pick a workflow to run.
description: Your main pushed to GitHub, its Actions watched until they pass; a failure fixed (the code or its test), pushed, watched again.

# ticket: false: it runs on no ticket (M-x agent-workflow-run). Its run is
# "github · run N"; no Beads.
ticket: false

# runs-in: where its jobs work. checkout: in yours, on its branch (main),
# their commits there; a job that edits waits while it has changes not
# committed. worktree (the default): a worktree and branch of its own.
runs-in: checkout

# How many agents may work on its runs at once: one (a workflow with no
# ticket, or in your checkout, has one run at a time anyway).
concurrency: 1

# What a run may spend: the cost of its agents' tokens (dollars) and its time
# (while it runs or waits for an agent, not for you). Used up, it asks you:
# more, or stop.
budget: {cost: 20, time: 4h}

# Its jobs, each named by its key. A job starts once the jobs it needs are
# done; one that needs none starts first.
jobs:

  # green: main pushed and its GitHub Actions passing.
  green:

    # Its steps, run one after another in your checkout, on main. It waits
    # to start while your checkout has changes not committed (its agent
    # would commit them).
    steps:

      # name: the step's own name in its job: the run's pane and log say it,
      # retry-from points at it.
      - name: check

        # run: a script, in bash; one naming a file of .agent-workflow/ runs
        # your checkout's copy, never the branch's. Exit 0: the next step;
        # 1: fixed by an agent, run again; 3: the run fails; another code:
        # the run asks you. Here: gh installed and logged in, your checkout
        # on main, a remote to push to; else 3.
        run: .agent-workflow/scripts/github-check.sh

      # push: your main (your HEAD: the fixes, your commits) pushed (nothing
      # new: on); refused (origin has commits you haven't), or your checkout
      # not on main any more, 2: the run asks you.
      - name: push
        run: .agent-workflow/scripts/github-push.sh

      # watch: the Actions of origin's main watched until they're done; one
      # failed, 1, its failed jobs' logs printed.
      - name: watch
        run: .agent-workflow/scripts/github-watch.sh

        # timeout: how long the step may run; past it, it broke (the run
        # asks you). The Actions can take a while.
        timeout: 2h

        # retries: how many times a failure (exit 1) is fixed and the step
        # run again; past them, the run asks you.
        retries: 5

        # retry-from: where a fixed failure runs the job again from: the
        # push, so the fix is pushed, then watched again.
        retry-from: push

        # on-fail: the profile of the agent sent the failure (the script's
        # output) to fix it, in a job with no agent of its own: ci reads the
        # logs, fixes the code or its test, commits on your main (only the
        # files it changed); it never pushes.
        on-fail: ci
