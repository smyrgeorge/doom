# The tests (tests/run.sh: unit and end-to-end) on each push and pull request,
# on Linux (with and without xwidgets, in tests/linux's Docker image) and on
# macOS (emacs-plus). Each machine is set up as the README says a user sets
# up theirs: scripts/emacs.sh (Emacs, then Doom), scripts/tools.sh (what
# init.el and the config need). So the installers are tested too.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Doom (doomemacs/core) commit the config is tested with: the one it's
  # used with. Bump it after updating Doom (git -C ~/.config/emacs rev-parse
  # HEAD).
  DOOM_REF: 7ccac7f643ad67baa25b216717cf8617a0903c69
  # Linux's Emacs (scripts/emacs.sh builds this release): pinned, so the
  # image's cached build stays the one used.
  EMACS_VERSION: "31.1"
  # Each end-to-end test file's limit, in seconds: runners are slower than a
  # desk's machine.
  E2E_TIMEOUT: "600"

jobs:
  linux:
    name: Linux (${{ matrix.xwidgets == 'yes' && 'with' || 'without' }} xwidgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        xwidgets: ["yes", "no"]
    env:
      XWIDGETS: ${{ matrix.xwidgets }}
      IMAGE: ${{ matrix.xwidgets == 'yes' && 'doom-config-tests' || 'doom-config-tests:no-xwidgets' }}
      # tests/linux/run.sh: the image as built here (its layers cached).
      SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Doom (cloned)
        run: |
          echo "DOOM_EMACS=$RUNNER_TEMP/doom-emacs" >> "$GITHUB_ENV"
          git clone -q https://github.com/doomemacs/core "$RUNNER_TEMP/doom-emacs"
          git -C "$RUNNER_TEMP/doom-emacs" checkout -q "$DOOM_REF"

      # Doom's packages, as `doom sync' built them (and PDF.js, Excalidraw):
      # again only when init.el, packages.el or Doom change (and then from the
      # last ones). Saved as soon as they're there (below), not at the job's
      # end: a test failing doesn't lose them.
      - name: Doom's packages (restored)
        id: doom-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/doom-emacs/.local
          key: doom-linux-${{ matrix.xwidgets }}-${{ env.DOOM_REF }}-${{ hashFiles('init.el', 'packages.el') }}
          restore-keys: doom-linux-${{ matrix.xwidgets }}-${{ env.DOOM_REF }}-

      - uses: docker/setup-buildx-action@v3

      # Debian, Emacs by scripts/emacs.sh, the tools by scripts/tools.sh
      # (tests/linux/Dockerfile): its layers cached, Emacs built again only
      # when emacs.sh changes.
      - name: The test image (scripts/emacs.sh, scripts/tools.sh)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/linux/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            XWIDGETS=${{ matrix.xwidgets }}
            EMACS_VERSION=${{ env.EMACS_VERSION }}
          cache-from: type=gha,scope=image-${{ matrix.xwidgets }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.xwidgets }}

      # scripts/emacs.sh in the image: Emacs is there (up to date), so Doom:
      # its modules, `doom sync' (--rebuild when its packages aren't built for
      # this Emacs). The container runs as root, and Doom's CLI refuses to run
      # as root unless its folder is root's (bin/doom): given to root here,
      # back to the runner's user after (the cache, saved by it, reads it).
      - name: Doom (scripts/emacs.sh)
        run: |
          sudo chown -R 0:0 "$DOOM_EMACS"
          docker run --rm -v "$GITHUB_WORKSPACE:/root/.config/doom" -v "$DOOM_EMACS:/root/.config/emacs" \
            -e EMACS_VERSION "$IMAGE" scripts/emacs.sh

      - name: Tools (scripts/tools.sh --check)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/root/.config/doom:ro" "$IMAGE" scripts/tools.sh --check

      # PDF.js and Excalidraw, as opening a PDF or a drawing downloads them:
      # their end-to-end tests run instead of skipping.
      - name: PDF.js and Excalidraw
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/root/.config/doom" -v "$DOOM_EMACS:/root/.config/emacs" \
            "$IMAGE" emacs --batch -l tests/helper.el -l tests/assets.el
          sudo chown -R "$(id -u):$(id -g)" "$DOOM_EMACS"

      - name: Doom's packages (saved)
        if: steps.doom-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/doom-emacs/.local
          key: ${{ steps.doom-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: tests/linux/run.sh unit

      - name: End-to-end tests
        run: tests/linux/run.sh e2e

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 150
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      # The README's step 1: this config as ~/.config/doom, Doom cloned.
      - name: This config and Doom
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/doom
          git clone -q https://github.com/doomemacs/core ~/.config/emacs
          git -C ~/.config/emacs checkout -q "$DOOM_REF"

      # Doom's packages (natively compiled: the longest to build), saved as
      # soon as they're there (below), as on Linux.
      - name: Doom's packages (restored)
        id: doom-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/emacs/.local
          key: doom-macos-${{ env.DOOM_REF }}-${{ hashFiles('init.el', 'packages.el') }}
          restore-keys: doom-macos-${{ env.DOOM_REF }}-

      # Homebrew's downloads (bottles, casks, its API's index): what emacs.sh
      # and tools.sh install is downloaded once a week, or when they change;
      # pouring them still happens each run (Homebrew's installed files aren't
      # cached: it keeps state and links outside them). A week's cache whole,
      # no older one to start from: it holds this week's versions only (old
      # weeks' go unused, and GitHub drops them after 7 days).
      - name: Homebrew's cache folder, this week
        id: brew-cache
        run: |
          echo "path=$(brew --cache)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Homebrew's downloads (restored)
        uses: actions/cache/restore@v4
        id: brew-restore
        with:
          path: ${{ steps.brew-cache.outputs.path }}
          key: brew-macos-${{ hashFiles('scripts/emacs.sh', 'scripts/tools.sh') }}-${{ steps.brew-cache.outputs.week }}

      # emacs-plus's Emacs.app, then Doom's modules and `doom sync'.
      - name: Emacs and Doom (scripts/emacs.sh)
        run: scripts/emacs.sh

      # Doom's tools, the modules' servers, formatters and linters, the fonts.
      - name: Tools (scripts/tools.sh)
        run: scripts/tools.sh

      - name: Homebrew's downloads (saved)
        if: steps.brew-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.brew-cache.outputs.path }}
          key: ${{ steps.brew-restore.outputs.cache-primary-key }}

      - name: PDF.js and Excalidraw
        run: emacs --batch -l tests/helper.el -l tests/assets.el

      - name: Doom's packages (saved)
        if: steps.doom-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.config/emacs/.local
          key: ${{ steps.doom-cache.outputs.cache-primary-key }}

      - name: Unit tests
        run: tests/run.sh unit

      - name: End-to-end tests
        run: tests/run.sh e2e
